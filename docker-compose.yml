services:
  um-status-gateway:
    build:
      context: .
    image: ghcr.io/hashed-albaham/mikrotik-um-gateway:local
    container_name: um-status-gateway
    ports:
      - "8080:8080"
    environment:
      UM_HOST: ${UM_HOST:-http://192.168.88.1}
      LOGOUT_DELAY_SECONDS: "${LOGOUT_DELAY_SECONDS:-60}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-15}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-*}"
    read_only: true
    mem_limit: 16m
    tmpfs:
      - /tmp
    restart: unless-stopped
