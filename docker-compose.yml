services:
  um-status-gateway:
    build:
      context: .
    image: ghcr.io/hashed-albaham/mikrotik-um-gateway:local
    container_name: um-status-gateway
    ports:
      - "8080:8080"
    environment:
      UM_TARGET_URL: ${UM_TARGET_URL:-}
      UM_PROTO: ${UM_PROTO:-http}
      UM_HOST: ${UM_HOST:-192.168.216.1}
      UM_PORT: ${UM_PORT:-12008}
      UM_INSECURE_SKIP_VERIFY: "${UM_INSECURE_SKIP_VERIFY:-true}"
      LOGOUT_DELAY_SECONDS: "${LOGOUT_DELAY_SECONDS:-60}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-6}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-*}"
      RELEASE_MEMORY_ON_SESSION_END: "${RELEASE_MEMORY_ON_SESSION_END:-true}"
    read_only: true
    mem_limit: 16m
    tmpfs:
      - /tmp
    restart: unless-stopped
